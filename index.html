
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Retrô</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #252522;
  font-family: monospace;
  padding: 15px;
}

.calculadora {
  width: 100%;
  max-width: 350px;
  background: #d5c5a4;
  padding: 22px;
  border-radius: 20px;
  border: 5px solid #9b8968;
  box-shadow: 8px 10px 0 #151512;
}

.titulo {
  text-align: center;
  color: #403725;
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 4px;
  margin-bottom: 18px;
}

.tela {
  background: #26342a;
  color: #a9e6a3;
  height: 90px;
  border: 5px solid #8b7959;
  border-radius: 8px;
  margin-bottom: 20px;
  padding: 12px;
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
  font-size: clamp(25px, 8vw, 36px);
  overflow: hidden;
  box-shadow: inset 0 0 12px #000;
  text-shadow: 0 0 8px #83ff70;
}

.botoes {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  height: 65px;
  border: none;
  border-radius: 9px;
  background: #eee0c2;
  color: #403725;
  font-size: 23px;
  font-weight: bold;
  box-shadow: 0 5px 0 #a18d69;
  cursor: pointer;
  transition: 0.1s;
  font-family: monospace;
}

button:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #a18d69;
}

.operador {
  background: #d39a55;
  color: #fff;
  box-shadow: 0 5px 0 #95632e;
}

.limpar {
  background: #a94d3e;
  color: white;
  box-shadow: 0 5px 0 #713126;
}

.igual {
  background: #657e54;
  color: white;
  box-shadow: 0 5px 0 #3d5032;
}

.zero {
  grid-column: span 2;
}

.rodape {
  text-align: center;
  margin-top: 20px;
  color: #66583e;
  font-size: 11px;
  letter-spacing: 2px;
}

@media(max-width: 380px) {
  .calculadora {
    padding: 15px;
  }

  button {
    height: 58px;
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="calculadora">

  <div class="titulo">RETRO CALC</div>

  <div class="tela" id="tela">0</div>

  <div class="botoes">
    <button class="limpar" onclick="limpar()">AC</button>
    <button onclick="apagar()">⌫</button>
    <button onclick="porcentagem()">%</button>
    <button class="operador" onclick="operar('/')">÷</button>

    <button onclick="numero('7')">7</button>
    <button onclick="numero('8')">8</button>
    <button onclick="numero('9')">9</button>
    <button class="operador" onclick="operar('*')">×</button>

    <button onclick="numero('4')">4</button>
    <button onclick="numero('5')">5</button>
    <button onclick="numero('6')">6</button>
    <button class="operador" onclick="operar('-')">−</button>

    <button onclick="numero('1')">1</button>
    <button onclick="numero('2')">2</button>
    <button onclick="numero('3')">3</button>
    <button class="operador" onclick="operar('+')">+</button>

    <button class="zero" onclick="numero('0')">0</button>
    <button onclick="decimal()">.</button>
    <button class="igual" onclick="calcular()">=</button>
  </div>

  <div class="rodape">DESIGNED IN RETRO STYLE</div>

</div>

<script>
const tela = document.getElementById("tela");

let atual = "0";
let anterior = null;
let operador = null;
let novoNumero = false;

function mostrar() {
  tela.textContent = atual;
}

function numero(n) {
  if (novoNumero || atual === "0" || atual === "Erro") {
    atual = n;
    novoNumero = false;
  } else if (atual.length < 14) {
    atual += n;
  }
  mostrar();
}

function decimal() {
  if (novoNumero || atual === "Erro") {
    atual = "0.";
    novoNumero = false;
  } else if (!atual.includes(".")) {
    atual += ".";
  }
  mostrar();
}

function limpar() {
  atual = "0";
  anterior = null;
  operador = null;
  novoNumero = false;
  mostrar();
}

function apagar() {
  if (novoNumero || atual === "Erro") {
    atual = "0";
    novoNumero = false;
  } else {
    atual = atual.length > 1 ? atual.slice(0, -1) : "0";
  }
  mostrar();
}

function operar(op) {
  if (atual === "Erro") return;

  if (operador && !novoNumero) {
    calcular();
  }

  anterior = parseFloat(atual);
  operador = op;
  novoNumero = true;
}

function calcular() {
  if (operador === null || anterior === null || atual === "Erro") return;

  const b = parseFloat(atual);
  let resultado;

  switch (operador) {
    case "+": resultado = anterior + b; break;
    case "-": resultado = anterior - b; break;
    case "*": resultado = anterior * b; break;
    case "/":
      if (b === 0) {
        atual = "Erro";
        anterior = null;
        operador = null;
        novoNumero = true;
        mostrar();
        return;
      }
      resultado = anterior / b;
      break;
  }

  atual = String(Number(resultado.toPrecision(10)));
  anterior = null;
  operador = null;
  novoNumero = true;
  mostrar();
}

function porcentagem() {
  if (atual === "Erro") return;
  atual = String(parseFloat(atual) / 100);
  mostrar();
}
</script>

</body>
</html>
